[project]
name = "fantasyedge"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "polars>=0.20",
    "numpy>=1.26",
    "scipy>=1.11",
    "requests>=2.31",
    "click>=8.1",          # CLI
    "tqdm>=4.66",
]

[project.optional-dependencies]
ingest = ["nfl-data-py>=0.3.2", "pyarrow>=14"]
solve = ["highspy>=1.5"]   # ILP for optimal lineup
dev = [
    "pytest>=7.4",
    "pytest-xdist>=3.5",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "pyright>=1.1",
    "ipython",
]

[project.scripts]
fantasyedge = "fantasyedge.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pyright]
typeCheckingMode = "strict"
include = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"